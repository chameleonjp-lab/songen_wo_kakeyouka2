name: Validate and publish Pages
on:
  pull_request:
  push:
    branches: ["main"]
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python scripts/test-pages.py
      - run: python scripts/prepare-pages.py
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: _site
  browser:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run test:browser
        env:
          HOME: /root
      - run: node scripts/share-capture.mjs
        env:
          HOME: /root
      - run: node scripts/share-visual.mjs
        env:
          HOME: /root
      - run: BROWSER_ENGINE=webkit node scripts/share-visual.mjs
        env:
          HOME: /root
      - name: Preserve anonymous actual-game material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: songen2-share-capture
          path: |
            test-results/share-capture/
            test-results/share-visible/
          if-no-files-found: ignore
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify Pages source and latest publication commit
        uses: actions/github-script@v7
        with:
          script: |
            const pages = await github.rest.repos.getPages({owner: context.repo.owner, repo: context.repo.repo});
            if (pages.data.build_type !== 'workflow') throw new Error('Set Settings > Pages > Source to GitHub Actions before merging.');
            const branch = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            if (branch.data.commit.sha !== context.sha) throw new Error('A newer publication commit exists; this run must not deploy.');
      - name: Deploy the validated artifact from this run
        id: deployment
        uses: actions/deploy-pages@v4
